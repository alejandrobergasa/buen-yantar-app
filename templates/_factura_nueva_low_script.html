<script>
  function normalizeText(s) {
    return (s || "")
      .toString()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/\s+/g, "")
      .toLowerCase();
  }

  function parseNumber(raw) {
    let t = (raw || "").trim().replace(/\s/g, "");
    if (!t) return null;
    if (t.includes(",") && t.includes(".")) {
      if (t.lastIndexOf(",") > t.lastIndexOf(".")) {
        t = t.replace(/\./g, "").replace(",", ".");
      } else {
        t = t.replace(/,/g, "");
      }
    } else {
      t = t.replace(",", ".");
    }
    const n = Number(t);
    return Number.isFinite(n) ? n : Number.NaN;
  }

  function debounce(fn, delay) {
    let timerId = 0;
    return (...args) => {
      window.clearTimeout(timerId);
      timerId = window.setTimeout(() => fn(...args), delay);
    };
  }

  const searchBox = document.getElementById("invoiceSearch");
  const groupFilter = document.getElementById("invoiceGroup");
  const invoiceFiltersForm = document.getElementById("invoiceFiltersForm");
  const productRows = Array.from(document.querySelectorAll(".invoice-product-row"));
  const invoiceProductsTbody = document.getElementById("invoiceProductsTbody");
  const noResultsBox = document.getElementById("invoiceNoResults");
  const invoiceLines = document.getElementById("invoiceLines");
  const invoiceEmpty = document.getElementById("invoiceEmpty");
  const rowTpl = document.getElementById("invoiceRowTpl");
  const invoiceForm = document.getElementById("invoiceForm");
  const hiddenFQ = document.getElementById("invoiceFQ");
  const hiddenFG = document.getElementById("invoiceFG");
  const sumAmountPinned = document.getElementById("sumAmountPinned");
  const invoiceConfirmDialog = document.getElementById("invoiceConfirmDialog");
  const closeInvoiceConfirmDialog = document.getElementById("closeInvoiceConfirmDialog");
  const confirmInvoiceSubmit = document.getElementById("confirmInvoiceSubmit");
  const invoiceConfirmList = document.getElementById("invoiceConfirmList");
  const invoiceConfirmDate = document.getElementById("invoiceConfirmDate");
  const invoiceConfirmNote = document.getElementById("invoiceConfirmNote");
  const invoiceConfirmTotal = document.getElementById("invoiceConfirmTotal");
  const selectedById = new Map();
  const draftKey = "buen-yantar:invoice-draft:low:v1";
  let invoiceConfirmAccepted = false;

  function productDataFromRow(sourceRow) {
    return {
      pid: sourceRow.dataset.productId,
      name: sourceRow.dataset.name || "",
      emoji: sourceRow.dataset.emoji || "📦",
      stockUnit: sourceRow.dataset.stockUnit || "ud",
      saleUnit: sourceRow.dataset.saleUnit || sourceRow.dataset.stockUnit || "ud",
      fractional: sourceRow.dataset.fraccionable === "1",
      fractions: sourceRow.dataset.fractions || "1",
      defaultPrice: sourceRow.dataset.price || "0",
    };
  }

  function serializeDraft() {
    return {
      filters: {
        q: (searchBox && searchBox.value || "").trim(),
        g: (groupFilter && groupFilter.value || "").trim(),
      },
      fields: {
        fecha_factura: invoiceForm.querySelector('[name="fecha_factura"]').value || "",
        nota_global: invoiceForm.querySelector('[name="nota_global"]').value || "",
      },
      lines: Array.from(invoiceLines.querySelectorAll(".invoice-row")).map((row) => ({
        pid: row.querySelector(".ticket-product-id").value || "",
        name: row.querySelector(".ticket-product-name")?.textContent?.replace(/^[^\s]+\s/, "") || "",
        emoji: row.querySelector(".ticket-product-name")?.textContent?.trim().split(/\s+/)[0] || "📦",
        stockUnit: row.dataset.stockUnit || "ud",
        saleUnit: row.dataset.saleUnit || "ud",
        fractional: row.dataset.fractional === "1",
        fractions: row.dataset.fractions || "1",
        defaultPrice: row.querySelector(".ticket-product-price").value || "0",
        qty: row.querySelector('input[name="cantidad[]"]').value || "",
      })),
    };
  }

  function hasDraftContent() {
    return (
      selectedById.size > 0
      || ((searchBox && searchBox.value || "").trim() !== "")
      || ((groupFilter && groupFilter.value || "").trim() !== "")
      || ((invoiceForm.querySelector('[name="nota_global"]').value || "").trim() !== "")
    );
  }

  function saveDraft() {
    if (!hasDraftContent()) {
      sessionStorage.removeItem(draftKey);
      return;
    }
    sessionStorage.setItem(draftKey, JSON.stringify(serializeDraft()));
  }

  function clearDraft() {
    sessionStorage.removeItem(draftKey);
  }

  function syncSelectedState() {
    productRows.forEach((row) => {
      row.classList.toggle("row-selected-soft", selectedById.has(row.dataset.productId || ""));
    });
  }

  function updateLineAmount(row) {
    const qty = parseNumber(row.querySelector('input[name="cantidad[]"]').value);
    const price = parseNumber(row.querySelector('input[name="precio_unitario[]"]').value);
    const amountNode = row.querySelector(".js-line-amount");
    if (!amountNode || qty === null || price === null || Number.isNaN(qty) || Number.isNaN(price) || qty <= 0 || price < 0) {
      if (amountNode) amountNode.textContent = "0.00 €";
      return;
    }
    amountNode.textContent = `${(qty * price).toFixed(2)} €`;
  }

  function refreshSummary() {
    let total = 0;
    Array.from(invoiceLines.querySelectorAll(".invoice-row")).forEach((row) => {
      const qty = parseNumber(row.querySelector('input[name="cantidad[]"]').value);
      const price = parseNumber(row.querySelector('input[name="precio_unitario[]"]').value);
      if (qty !== null && price !== null && !Number.isNaN(qty) && !Number.isNaN(price) && qty > 0 && price >= 0) {
        total += qty * price;
      }
      updateLineAmount(row);
    });
    if (sumAmountPinned) sumAmountPinned.textContent = `${total.toFixed(2)} €`;
  }

  function showAppDialog(dialog) {
    if (!dialog) return;
    if (typeof dialog.showModal === "function") {
      if (!dialog.open) dialog.showModal();
      return;
    }
    dialog.setAttribute("open", "open");
  }

  function closeAppDialog(dialog) {
    if (!dialog) return;
    if (typeof dialog.close === "function") {
      if (dialog.open) dialog.close();
      return;
    }
    dialog.removeAttribute("open");
  }

  function invoiceRowsSnapshot() {
    return Array.from(invoiceLines.querySelectorAll(".invoice-row")).map((row) => {
      const name = row.querySelector(".ticket-product-name")?.textContent?.trim() || "-";
      const qty = row.querySelector('input[name="cantidad[]"]').value || "0";
      const price = row.querySelector('input[name="precio_unitario[]"]').value || "0";
      const amount = row.querySelector(".js-line-amount")?.textContent?.trim() || "0.00 €";
      const saleUnit = row.dataset.saleUnit || "ud";
      return { name, qty, price, amount, saleUnit };
    });
  }

  function formatMoneyValue(raw) {
    const value = parseNumber(raw);
    return value !== null && !Number.isNaN(value) ? `${value.toFixed(2)} €` : "-";
  }

  function buildInvoiceConfirmList(rows) {
    if (!invoiceConfirmList) return;
    invoiceConfirmList.replaceChildren();

    if (!rows.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No hay líneas para confirmar.";
      invoiceConfirmList.appendChild(empty);
      return;
    }

    rows.forEach((item) => {
      const card = document.createElement("div");
      card.className = "invoice-confirm-item";

      const head = document.createElement("div");
      head.className = "invoice-confirm-item-head";

      const title = document.createElement("strong");
      title.textContent = item.name;

      const amount = document.createElement("span");
      amount.textContent = item.amount;

      head.append(title, amount);

      const meta = document.createElement("div");
      meta.className = "invoice-confirm-item-meta";
      meta.textContent = `Cantidad ${item.qty} ${item.saleUnit} · Precio ${formatMoneyValue(item.price)} / ${item.saleUnit}`;

      card.append(head, meta);
      invoiceConfirmList.appendChild(card);
    });
  }

  function openInvoiceConfirmDialog() {
    const rows = invoiceRowsSnapshot();
    buildInvoiceConfirmList(rows);
    if (invoiceConfirmDate) {
      invoiceConfirmDate.textContent = invoiceForm.querySelector('[name="fecha_factura"]').value || "-";
    }
    if (invoiceConfirmNote) {
      invoiceConfirmNote.textContent = (invoiceForm.querySelector('[name="nota_global"]').value || "").trim() || "Sin nota";
    }
    if (invoiceConfirmTotal) {
      invoiceConfirmTotal.textContent = sumAmountPinned ? sumAmountPinned.textContent : "0.00 €";
    }
    showAppDialog(invoiceConfirmDialog);
  }

  function refreshEmptyState() {
    if (invoiceEmpty) invoiceEmpty.style.display = selectedById.size === 0 ? "" : "none";
    syncSelectedState();
  }

  function attachRowEvents(row) {
    const qtyInput = row.querySelector('input[name="cantidad[]"]');
    const removeBtn = row.querySelector(".purchase-remove");
    const pid = row.querySelector(".ticket-product-id").value;

    if (qtyInput) {
      qtyInput.addEventListener("input", () => {
        refreshSummary();
        saveDraft();
      });
    }
    if (removeBtn) {
      removeBtn.addEventListener("click", () => {
        selectedById.delete(pid);
        row.remove();
        refreshEmptyState();
        refreshSummary();
        saveDraft();
      });
    }
  }

  function appendInvoiceRow(data, options = {}) {
    const row = rowTpl.content.firstElementChild.cloneNode(true);
    row.querySelector(".ticket-product-id").value = data.pid;
    row.querySelector(".ticket-product-price").value = data.defaultPrice || "0";
    row.querySelector(".ticket-product-name").textContent = `${data.emoji} ${data.name}`;
    row.querySelector(".ticket-product-meta").textContent = data.fractional
      ? `Venta en ${data.saleUnit} · ${data.fractions} ${data.saleUnit} por ${data.stockUnit}`
      : `Unidad de venta: ${data.saleUnit}`;
    row.querySelector('input[name="cantidad[]"]').value = "1";
    row.querySelector(".js-line-price").textContent = `${(parseNumber(data.defaultPrice) || 0).toFixed(2)} €`;
    row.dataset.saleUnit = data.saleUnit || "ud";

    invoiceLines.appendChild(row);
    selectedById.set(data.pid, row);
    attachRowEvents(row);
    refreshEmptyState();
    refreshSummary();

    if (options.focus !== false) {
      const qtyInput = row.querySelector('input[name="cantidad[]"]');
      qtyInput.focus();
      qtyInput.select();
    }
  }

  function addProductToInvoice(sourceRow) {
    const pid = sourceRow.dataset.productId;
    if (!pid) return;

    if (selectedById.has(pid)) {
      const existingRow = selectedById.get(pid);
      const qtyInput = existingRow.querySelector('input[name="cantidad[]"]');
      const currentQty = parseNumber(qtyInput.value);
      qtyInput.value = String((currentQty !== null && !Number.isNaN(currentQty) ? currentQty : 0) + 1);
      refreshSummary();
      saveDraft();
      qtyInput.focus();
      qtyInput.select();
      return;
    }

    appendInvoiceRow(productDataFromRow(sourceRow));
    saveDraft();
  }

  function applyProductFilters() {
    const q = normalizeText(searchBox ? searchBox.value : "");
    const g = (groupFilter && groupFilter.value || "").trim();
    let visible = 0;

    productRows.forEach((row) => {
      const name = normalizeText(row.dataset.name || "");
      const group = (row.dataset.group || "").trim();
      const match = (!q || name.includes(q)) && (!g || group === g);
      row.style.display = match ? "" : "none";
      if (match) visible += 1;
    });

    if (noResultsBox) noResultsBox.hidden = visible !== 0;
    if (hiddenFQ) hiddenFQ.value = (searchBox && searchBox.value || "").trim();
    if (hiddenFG) hiddenFG.value = (groupFilter && groupFilter.value || "").trim();
  }

  if (invoiceProductsTbody) {
    invoiceProductsTbody.addEventListener("click", (event) => {
      const row = event.target.closest(".invoice-product-row");
      if (row) addProductToInvoice(row);
    });
    invoiceProductsTbody.addEventListener("keydown", (event) => {
      const row = event.target.closest(".invoice-product-row");
      if (!row) return;
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        addProductToInvoice(row);
      }
    });
  }

  if (invoiceFiltersForm) {
    const submitFilters = debounce(() => {
      saveDraft();
      invoiceFiltersForm.requestSubmit();
    }, 180);
    if (searchBox) searchBox.addEventListener("input", submitFilters);
    if (groupFilter) groupFilter.addEventListener("change", () => {
      saveDraft();
      invoiceFiltersForm.requestSubmit();
    });
  } else {
    if (searchBox) searchBox.addEventListener("input", debounce(applyProductFilters, 120));
    if (groupFilter) groupFilter.addEventListener("change", applyProductFilters);
  }

  if (closeInvoiceConfirmDialog && invoiceConfirmDialog) {
    closeInvoiceConfirmDialog.addEventListener("click", () => closeAppDialog(invoiceConfirmDialog));
    invoiceConfirmDialog.addEventListener("click", (event) => {
      if (event.target === invoiceConfirmDialog) {
        closeAppDialog(invoiceConfirmDialog);
      }
    });
  }

  if (confirmInvoiceSubmit) {
    confirmInvoiceSubmit.addEventListener("click", () => {
      invoiceConfirmAccepted = true;
      closeAppDialog(invoiceConfirmDialog);
      if (typeof invoiceForm.requestSubmit === "function") {
        invoiceForm.requestSubmit();
      } else {
        invoiceForm.submit();
      }
    });
  }

  invoiceForm.addEventListener("submit", (event) => {
    if (invoiceConfirmAccepted) {
      invoiceConfirmAccepted = false;
      clearDraft();
      return;
    }
    const rows = Array.from(invoiceLines.querySelectorAll(".invoice-row"));
    if (!rows.length) {
      event.preventDefault();
      alert("Debes anadir al menos un producto antes de registrar la factura.");
      return;
    }

    let hasErrors = false;
    rows.forEach((row) => {
      const qtyInput = row.querySelector('input[name="cantidad[]"]');
      const qtyValue = parseNumber(qtyInput.value);
      if (qtyValue === null || Number.isNaN(qtyValue) || qtyValue <= 0) {
        hasErrors = true;
      } else {
        qtyInput.value = String(qtyValue);
      }
    });

    if (hasErrors) {
      event.preventDefault();
      alert("Revisa las cantidades antes de registrar la factura.");
      return;
    }

    event.preventDefault();
    openInvoiceConfirmDialog();
  });

  (function restoreDraft() {
    const raw = sessionStorage.getItem(draftKey);
    if (!raw) return;
    try {
      const draft = JSON.parse(raw);
      if (draft.filters) {
        if (searchBox) searchBox.value = draft.filters.q || (searchBox.value || "");
        if (groupFilter) groupFilter.value = draft.filters.g || (groupFilter.value || "");
      }
      if (draft.fields) {
        invoiceForm.querySelector('[name="fecha_factura"]').value = draft.fields.fecha_factura || invoiceForm.querySelector('[name="fecha_factura"]').value;
        invoiceForm.querySelector('[name="nota_global"]').value = draft.fields.nota_global || "";
      }
      if (Array.isArray(draft.lines)) {
        draft.lines.forEach((line) => {
          if (!line || !line.pid || selectedById.has(line.pid)) return;
          const sourceRow = productRows.find((tr) => tr.dataset.productId === line.pid);
          const baseData = sourceRow ? productDataFromRow(sourceRow) : {
            pid: line.pid,
            name: line.name || line.pid,
            emoji: line.emoji || "📦",
            stockUnit: line.stockUnit || "ud",
            saleUnit: line.saleUnit || line.stockUnit || "ud",
            fractional: Boolean(line.fractional),
            fractions: line.fractions || "1",
            defaultPrice: line.defaultPrice || "0",
          };
          appendInvoiceRow(
            {
              ...baseData,
              qty: line.qty || "1",
              defaultPrice: line.defaultPrice || baseData.defaultPrice || "0",
            },
            { focus: false }
          );
        });
      }
    } catch (error) {
      clearDraft();
    }
  })();

  if (!invoiceFiltersForm) {
    applyProductFilters();
  }
  refreshEmptyState();
  refreshSummary();
</script>
