<script>
  function normalizeText(s) {
    return (s || "")
      .toString()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/\s+/g, "")
      .toLowerCase();
  }

  function parseNumber(raw) {
    let t = (raw || "").trim().replace(/\s/g, "");
    if (!t) return null;
    if (t.includes(",") && t.includes(".")) {
      if (t.lastIndexOf(",") > t.lastIndexOf(".")) {
        t = t.replace(/\./g, "").replace(",", ".");
      } else {
        t = t.replace(/,/g, "");
      }
    } else {
      t = t.replace(",", ".");
    }
    const n = Number(t);
    return Number.isFinite(n) ? n : Number.NaN;
  }

  function debounce(fn, delay) {
    let timerId = 0;
    return (...args) => {
      window.clearTimeout(timerId);
      timerId = window.setTimeout(() => fn(...args), delay);
    };
  }

  function formatMoney(value) {
    return `${value.toFixed(2)} €`;
  }

  function showAppDialog(dialog) {
    if (!dialog) return;
    if (typeof dialog.showModal === "function") {
      if (!dialog.open) dialog.showModal();
      return;
    }
    dialog.setAttribute("open", "open");
  }

  function closeAppDialog(dialog) {
    if (!dialog) return;
    if (typeof dialog.close === "function") {
      if (dialog.open) dialog.close();
      return;
    }
    dialog.removeAttribute("open");
  }

  const searchBox = document.getElementById("purchaseSearch");
  const groupFilter = document.getElementById("purchaseGroup");
  const purchaseFiltersForm = document.getElementById("purchaseFiltersForm");
  const productRows = Array.from(document.querySelectorAll(".purchase-product-row"));
  const purchaseProductsTbody = document.getElementById("productsPickTbody");
  const noResultsBox = document.getElementById("purchaseNoResults");
  const purchaseLines = document.getElementById("purchaseLines");
  const purchaseEmpty = document.getElementById("purchaseEmpty");
  const rowTpl = document.getElementById("ticketRowTpl");
  const purchaseForm = document.getElementById("purchaseForm");
  const hiddenFQ = document.getElementById("purchaseFQ");
  const hiddenFG = document.getElementById("purchaseFG");
  const sumAmount = document.getElementById("sumAmount");
  const purchaseConfirmDialog = document.getElementById("purchaseConfirmDialog");
  const closePurchaseConfirmDialog = document.getElementById("closePurchaseConfirmDialog");
  const confirmPurchaseSubmit = document.getElementById("confirmPurchaseSubmit");
  const purchaseConfirmList = document.getElementById("purchaseConfirmList");
  const purchaseWarningList = document.getElementById("purchaseWarningList");
  const purchaseConfirmDate = document.getElementById("purchaseConfirmDate");
  const purchaseConfirmNote = document.getElementById("purchaseConfirmNote");
  const purchaseConfirmTotal = document.getElementById("purchaseConfirmTotal");
  const selectedById = new Map();
  const draftKey = "buen-yantar:purchase-draft:low:v1";
  let purchaseConfirmAccepted = false;

  function productDataFromRow(sourceRow) {
    return {
      pid: sourceRow.dataset.productId,
      name: sourceRow.dataset.name || "",
      emoji: sourceRow.dataset.emoji || "📦",
      stockUnit: sourceRow.dataset.stockUnit || "ud",
      saleUnit: sourceRow.dataset.saleUnit || sourceRow.dataset.stockUnit || "ud",
      fractional: sourceRow.dataset.fraccionable === "1",
      fractions: sourceRow.dataset.fractions || "1",
      salePrice: sourceRow.dataset.salePrice || "",
      originalSalePrice: sourceRow.dataset.salePrice || "",
    };
  }

  function serializeDraft() {
    return {
      filters: {
        q: (searchBox && searchBox.value || "").trim(),
        g: (groupFilter && groupFilter.value || "").trim(),
      },
      fields: {
        fecha_compra: purchaseForm.querySelector('[name="fecha_compra"]').value || "",
        nota_global: purchaseForm.querySelector('[name="nota_global"]').value || "",
      },
      lines: Array.from(purchaseLines.querySelectorAll(".purchase-row")).map((row) => ({
        pid: row.querySelector(".ticket-product-id").value || "",
        name: row.querySelector(".ticket-product-name")?.textContent?.replace(/^[^\s]+\s/, "") || "",
        emoji: row.querySelector(".ticket-product-name")?.textContent?.trim().split(/\s+/)[0] || "📦",
        stockUnit: row.dataset.stockUnit || "ud",
        saleUnit: row.dataset.saleUnit || "ud",
        fractional: row.dataset.fractional === "1",
        fractions: row.dataset.fractions || "1",
        salePrice: row.querySelector('input[name="precio_venta_actual[]"]').value || "",
        originalSalePrice: row.dataset.originalSalePrice || "",
        qty: row.querySelector('input[name="cantidad[]"]').value || "",
        price: row.querySelector('input[name="precio_compra[]"]').value || "",
        subtotal: row.querySelector('input[name="subtotal_compra[]"]').value || "",
        note: row.querySelector('input[name="nota_linea[]"]').value || "",
      })),
    };
  }

  function hasDraftContent() {
    return (
      selectedById.size > 0
      || ((searchBox && searchBox.value || "").trim() !== "")
      || ((groupFilter && groupFilter.value || "").trim() !== "")
      || ((purchaseForm.querySelector('[name="nota_global"]').value || "").trim() !== "")
    );
  }

  function saveDraft() {
    if (!hasDraftContent()) {
      sessionStorage.removeItem(draftKey);
      return;
    }
    sessionStorage.setItem(draftKey, JSON.stringify(serializeDraft()));
  }

  function clearDraft() {
    sessionStorage.removeItem(draftKey);
  }

  function syncSelectedState() {
    productRows.forEach((row) => {
      row.classList.toggle("row-selected-soft", selectedById.has(row.dataset.productId || ""));
    });
  }

  function getPurchasePricing({ qty, unitPrice, subtotal, fractional, fractions }) {
    const qtyValue = parseNumber(qty);
    const unitPriceValue = parseNumber(unitPrice);
    const subtotalValue = parseNumber(subtotal);
    const fractionsValue = parseNumber(fractions || "1");
    const isFractional = fractional === true || fractional === "1";
    const hasQty = qtyValue !== null && !Number.isNaN(qtyValue) && qtyValue > 0;
    const hasUnitPrice = unitPriceValue !== null && !Number.isNaN(unitPriceValue) && unitPriceValue >= 0;
    const hasSubtotal = subtotalValue !== null && !Number.isNaN(subtotalValue) && subtotalValue >= 0;
    const hasFractions = fractionsValue !== null && !Number.isNaN(fractionsValue) && fractionsValue > 0;

    const lineTotal = isFractional
      ? (hasSubtotal ? subtotalValue : null)
      : (hasQty && hasUnitPrice ? qtyValue * unitPriceValue : null);
    const unitPurchasePrice = isFractional
      ? (hasSubtotal && hasQty ? subtotalValue / qtyValue : null)
      : (hasUnitPrice ? unitPriceValue : null);
    const saleUnitBasePrice = unitPurchasePrice !== null && (!isFractional || hasFractions)
      ? (isFractional ? unitPurchasePrice / fractionsValue : unitPurchasePrice)
      : null;

    return {
      lineTotal,
      recommendedSalePrice: saleUnitBasePrice !== null ? saleUnitBasePrice * 1.2 : null,
    };
  }

  function updateSaleRecommendation(row) {
    const recommendedNode = row.querySelector(".purchase-sale-recommended");
    if (!recommendedNode) return;
    const pricing = getPurchasePricing({
      qty: row.querySelector('input[name="cantidad[]"]').value,
      unitPrice: row.querySelector('input[name="precio_compra[]"]').value,
      subtotal: row.querySelector('input[name="subtotal_compra[]"]').value,
      fractional: row.dataset.fractional,
      fractions: row.dataset.fractions,
    });
    recommendedNode.textContent = pricing.recommendedSalePrice === null ? "-" : formatMoney(pricing.recommendedSalePrice);
  }

  function refreshSummary() {
    let total = 0;
    Array.from(purchaseLines.querySelectorAll(".purchase-row")).forEach((row) => {
      const pricing = getPurchasePricing({
        qty: row.querySelector('input[name="cantidad[]"]').value,
        unitPrice: row.querySelector('input[name="precio_compra[]"]').value,
        subtotal: row.querySelector('input[name="subtotal_compra[]"]').value,
        fractional: row.dataset.fractional,
        fractions: row.dataset.fractions,
      });
      if (pricing.lineTotal !== null) total += pricing.lineTotal;
    });
    if (sumAmount) sumAmount.textContent = formatMoney(total);
  }

  function buildPurchaseConfirmList(rows) {
    if (!purchaseConfirmList) return;
    purchaseConfirmList.replaceChildren();

    rows.forEach((item) => {
      const card = document.createElement("div");
      card.className = "invoice-confirm-item";

      const head = document.createElement("div");
      head.className = "invoice-confirm-item-head";

      const title = document.createElement("strong");
      title.textContent = item.name;

      const amount = document.createElement("span");
      amount.textContent = item.lineTotal !== null ? formatMoney(item.lineTotal) : "-";

      head.append(title, amount);

      const meta = document.createElement("div");
      meta.className = "invoice-confirm-item-meta";
      if (item.fractional) {
        const subtotalValue = parseNumber(item.subtotal);
        meta.textContent = `Cantidad ${item.qty} ${item.stockUnit} · P. total ${subtotalValue !== null && !Number.isNaN(subtotalValue) ? formatMoney(subtotalValue) : "-"} · Venta ${item.salePrice || "0"} € / ${item.saleUnit}`;
      } else {
        const unitPriceValue = parseNumber(item.unitPrice);
        meta.textContent = `Cantidad ${item.qty} ${item.stockUnit} · P. ud ${unitPriceValue !== null && !Number.isNaN(unitPriceValue) ? formatMoney(unitPriceValue) : "-"} / ${item.stockUnit} · P. total ${item.lineTotal !== null ? formatMoney(item.lineTotal) : "-"} · Venta ${item.salePrice || "0"} € / ${item.saleUnit}`;
      }
      card.append(head, meta);

      if ((item.note || "").trim()) {
        const note = document.createElement("div");
        note.className = "invoice-confirm-item-meta";
        note.textContent = `Nota: ${item.note.trim()}`;
        card.appendChild(note);
      }

      purchaseConfirmList.appendChild(card);
    });

    if (!rows.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No hay líneas para confirmar.";
      purchaseConfirmList.appendChild(empty);
    }
  }

  function buildPurchaseWarningList(rows) {
    if (!purchaseWarningList) return;
    purchaseWarningList.replaceChildren();

    const changed = rows.filter((item) => {
      const original = parseNumber(item.originalSalePrice);
      const next = parseNumber(item.salePrice);
      return original !== null && next !== null && !Number.isNaN(original) && !Number.isNaN(next) && Math.abs(original - next) > 1e-9;
    });

    if (!changed.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No hay cambios en precios de venta. El inventario mantendrá los valores actuales.";
      purchaseWarningList.appendChild(empty);
      return;
    }

    changed.forEach((item) => {
      const card = document.createElement("div");
      card.className = "purchase-warning-item";

      const title = document.createElement("strong");
      title.className = "purchase-warning-title";
      title.textContent = item.name;

      const subtitle = document.createElement("div");
      subtitle.className = "purchase-warning-line";
      subtitle.textContent = `Venta en ${item.saleUnit}`;

      const originalValue = parseNumber(item.originalSalePrice) || 0;
      const nextValue = parseNumber(item.salePrice) || 0;
      const recommendedValue = item.recommendedValue !== null && item.recommendedValue !== undefined
        ? item.recommendedValue
        : null;
      const deltaValue = nextValue - originalValue;

      const stats = document.createElement("div");
      stats.className = "purchase-warning-stats";

      [
        { label: "Anterior", value: formatMoney(originalValue) },
        { label: "Recomendado", value: recommendedValue !== null ? formatMoney(recommendedValue) : "-" },
        { label: "Nuevo", value: formatMoney(nextValue) },
        { label: "Diferencia", value: `${deltaValue >= 0 ? "+" : ""}${formatMoney(deltaValue)}`, tone: deltaValue > 0 ? "up" : (deltaValue < 0 ? "down" : "same") },
      ].forEach((entry) => {
        const cell = document.createElement("div");
        cell.className = `purchase-warning-stat${entry.tone ? ` purchase-warning-stat-${entry.tone}` : ""}`;

        const label = document.createElement("span");
        label.className = "purchase-warning-stat-label";
        label.textContent = entry.label;

        const value = document.createElement("strong");
        value.className = "purchase-warning-stat-value";
        value.textContent = entry.value;

        cell.append(label, value);
        stats.appendChild(cell);
      });

      card.append(title, subtitle, stats);
      purchaseWarningList.appendChild(card);
    });
  }

  function openPurchaseConfirmDialog() {
    const rows = purchaseRowsSnapshot();
    buildPurchaseConfirmList(rows);
    buildPurchaseWarningList(rows);
    if (purchaseConfirmDate) {
      purchaseConfirmDate.textContent = purchaseForm.querySelector('[name="fecha_compra"]').value || "-";
    }
    if (purchaseConfirmNote) {
      purchaseConfirmNote.textContent = (purchaseForm.querySelector('[name="nota_global"]').value || "").trim() || "Sin nota";
    }
    if (purchaseConfirmTotal) {
      purchaseConfirmTotal.textContent = sumAmount ? sumAmount.textContent : "0.00 €";
    }
    showAppDialog(purchaseConfirmDialog);
  }

  function purchaseRowsSnapshot() {
    return Array.from(purchaseLines.querySelectorAll(".purchase-row")).map((row) => {
      const name = row.querySelector(".ticket-product-name")?.textContent?.trim() || "-";
      const qty = row.querySelector('input[name="cantidad[]"]').value || "0";
      const unitPrice = row.querySelector('input[name="precio_compra[]"]').value || "";
      const subtotal = row.querySelector('input[name="subtotal_compra[]"]').value || "";
      const salePrice = row.querySelector('input[name="precio_venta_actual[]"]').value || "";
      const note = row.querySelector('input[name="nota_linea[]"]').value || "";
      const stockUnit = row.dataset.stockUnit || "ud";
      const saleUnit = row.dataset.saleUnit || stockUnit;
      const fractional = row.dataset.fractional === "1";
      const fractions = row.dataset.fractions || "1";
      const pricing = getPurchasePricing({ qty, unitPrice, subtotal, fractional, fractions });
      return {
        name,
        qty,
        unitPrice,
        subtotal,
        salePrice,
        note,
        stockUnit,
        saleUnit,
        fractional,
        originalSalePrice: row.dataset.originalSalePrice || "",
        recommendedValue: pricing.recommendedSalePrice,
        lineTotal: pricing.lineTotal,
      };
    });
  }

  function refreshEmptyState() {
    if (purchaseEmpty) purchaseEmpty.style.display = selectedById.size === 0 ? "" : "none";
    syncSelectedState();
  }

  function syncLinePricing(row) {
    const subtotalInput = row.querySelector('input[name="subtotal_compra[]"]');
    const subtotalPassive = row.querySelector(".purchase-total-passive");
    const pricing = getPurchasePricing({
      qty: row.querySelector('input[name="cantidad[]"]').value,
      unitPrice: row.querySelector('input[name="precio_compra[]"]').value,
      subtotal: subtotalInput.value,
      fractional: row.dataset.fractional,
      fractions: row.dataset.fractions,
    });
    if (row.dataset.fractional !== "1") {
      subtotalInput.value = pricing.lineTotal !== null ? pricing.lineTotal.toFixed(2) : "";
      if (subtotalPassive) {
        subtotalPassive.textContent = pricing.lineTotal !== null ? formatMoney(pricing.lineTotal) : "-";
      }
    }
    updateSaleRecommendation(row);
    refreshSummary();
  }

  function configurePurchaseRow(row) {
    const isFractional = row.dataset.fractional === "1";
    const unitPriceInput = row.querySelector('input[name="precio_compra[]"]');
    const unitPricePassive = row.querySelector(".purchase-price-passive");
    const subtotalInput = row.querySelector('input[name="subtotal_compra[]"]');
    const subtotalPassive = row.querySelector(".purchase-total-passive");

    unitPriceInput.type = isFractional ? "hidden" : "text";
    unitPriceInput.hidden = isFractional;
    unitPriceInput.style.display = isFractional ? "none" : "";
    unitPricePassive.hidden = !isFractional;
    unitPricePassive.style.display = isFractional ? "flex" : "none";
    unitPricePassive.setAttribute("aria-hidden", isFractional ? "false" : "true");
    unitPricePassive.textContent = "-";

    subtotalInput.type = isFractional ? "text" : "hidden";
    subtotalInput.hidden = !isFractional;
    subtotalInput.style.display = isFractional ? "" : "none";
    if (subtotalPassive) {
      subtotalPassive.hidden = isFractional;
      subtotalPassive.style.display = isFractional ? "none" : "flex";
      subtotalPassive.setAttribute("aria-hidden", isFractional ? "true" : "false");
      subtotalPassive.textContent = "-";
    }
    subtotalInput.readOnly = !isFractional;
    subtotalInput.classList.toggle("input-readonly", !isFractional);
    subtotalInput.placeholder = isFractional ? "0.00" : "Auto";

    if (!isFractional) {
      subtotalInput.value = "";
    }
  }

  function attachTicketEvents(row) {
    const qtyInput = row.querySelector('input[name="cantidad[]"]');
    const unitPriceInput = row.querySelector('input[name="precio_compra[]"]');
    const subtotalInput = row.querySelector('input[name="subtotal_compra[]"]');
    const salePriceInput = row.querySelector('input[name="precio_venta_actual[]"]');
    const removeBtn = row.querySelector(".purchase-remove");
    const pid = row.querySelector(".ticket-product-id").value;

    [qtyInput, unitPriceInput, subtotalInput].forEach((input) => {
      input.addEventListener("input", () => {
        syncLinePricing(row);
        saveDraft();
      });
    });
    if (salePriceInput) {
      salePriceInput.addEventListener("input", () => {
        refreshSummary();
        saveDraft();
      });
    }
    const noteInput = row.querySelector('input[name="nota_linea[]"]');
    if (noteInput) noteInput.addEventListener("input", saveDraft);
    if (removeBtn) {
      removeBtn.addEventListener("click", () => {
        selectedById.delete(pid);
        row.remove();
        refreshEmptyState();
        refreshSummary();
        saveDraft();
      });
    }
  }

  function appendPurchaseRow(data, options = {}) {
    const row = rowTpl.content.firstElementChild.cloneNode(true);
    row.querySelector(".ticket-product-id").value = data.pid;
    row.querySelector(".ticket-product-name").textContent = `${data.emoji} ${data.name}`;
    row.querySelector(".ticket-product-meta").textContent = data.fractional
      ? `Compra en ${data.stockUnit} · Venta en ${data.saleUnit} · ${data.fractions} ${data.saleUnit} por ${data.stockUnit}`
      : `Compra y venta en ${data.stockUnit}`;
    row.querySelector('input[name="cantidad[]"]').value = data.qty || "1";
    row.querySelector('input[name="precio_compra[]"]').value = data.price || "";
    row.querySelector('input[name="subtotal_compra[]"]').value = data.subtotal || "";
    row.querySelector('input[name="precio_venta_actual[]"]').value = data.salePrice || "";
    row.querySelector('input[name="nota_linea[]"]').value = data.note || "";
    row.dataset.originalSalePrice = data.originalSalePrice || data.salePrice || "";
    row.dataset.stockUnit = data.stockUnit || "ud";
    row.dataset.saleUnit = data.saleUnit || data.stockUnit || "ud";
    row.dataset.fractional = data.fractional ? "1" : "0";
    row.dataset.fractions = data.fractions || "1";

    purchaseLines.appendChild(row);
    selectedById.set(data.pid, row);
    configurePurchaseRow(row);
    attachTicketEvents(row);
    syncLinePricing(row);
    refreshEmptyState();

    if (options.focus !== false) {
      const qtyInput = row.querySelector('input[name="cantidad[]"]');
      qtyInput.focus();
      qtyInput.select();
    }
  }

  function addProductToTicket(sourceRow) {
    const pid = sourceRow.dataset.productId;
    if (!pid) return;

    if (selectedById.has(pid)) {
      const existingRow = selectedById.get(pid);
      const qtyInput = existingRow.querySelector('input[name="cantidad[]"]');
      const currentQty = parseNumber(qtyInput.value);
      qtyInput.value = String((currentQty !== null && !Number.isNaN(currentQty) ? currentQty : 0) + 1);
      syncLinePricing(existingRow);
      saveDraft();
      qtyInput.focus();
      qtyInput.select();
      return;
    }

    appendPurchaseRow(productDataFromRow(sourceRow));
    saveDraft();
  }

  function applyProductFilters() {
    const q = normalizeText(searchBox ? searchBox.value : "");
    const g = (groupFilter && groupFilter.value || "").trim();
    let visible = 0;

    productRows.forEach((row) => {
      const name = normalizeText(row.dataset.name || "");
      const group = (row.dataset.group || "").trim();
      const match = (!q || name.includes(q)) && (!g || group === g);
      row.style.display = match ? "" : "none";
      if (match) visible += 1;
    });

    if (noResultsBox) noResultsBox.hidden = visible !== 0;
    if (hiddenFQ) hiddenFQ.value = (searchBox && searchBox.value || "").trim();
    if (hiddenFG) hiddenFG.value = (groupFilter && groupFilter.value || "").trim();
  }

  if (purchaseProductsTbody) {
    purchaseProductsTbody.addEventListener("click", (event) => {
      const row = event.target.closest(".purchase-product-row");
      if (row) addProductToTicket(row);
    });
    purchaseProductsTbody.addEventListener("keydown", (event) => {
      const row = event.target.closest(".purchase-product-row");
      if (!row) return;
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        addProductToTicket(row);
      }
    });
  }

  if (purchaseFiltersForm) {
    const submitFilters = debounce(() => {
      saveDraft();
      purchaseFiltersForm.requestSubmit();
    }, 180);
    if (searchBox) searchBox.addEventListener("input", submitFilters);
    if (groupFilter) groupFilter.addEventListener("change", () => {
      saveDraft();
      purchaseFiltersForm.requestSubmit();
    });
  } else {
    if (searchBox) searchBox.addEventListener("input", debounce(applyProductFilters, 120));
    if (groupFilter) groupFilter.addEventListener("change", applyProductFilters);
  }

  if (closePurchaseConfirmDialog && purchaseConfirmDialog) {
    closePurchaseConfirmDialog.addEventListener("click", () => closeAppDialog(purchaseConfirmDialog));
    purchaseConfirmDialog.addEventListener("click", (event) => {
      if (event.target === purchaseConfirmDialog) {
        closeAppDialog(purchaseConfirmDialog);
      }
    });
  }

  if (confirmPurchaseSubmit) {
    confirmPurchaseSubmit.addEventListener("click", () => {
      purchaseConfirmAccepted = true;
      closeAppDialog(purchaseConfirmDialog);
      if (typeof purchaseForm.requestSubmit === "function") {
        purchaseForm.requestSubmit();
      } else {
        purchaseForm.submit();
      }
    });
  }

  purchaseForm.addEventListener("submit", (event) => {
    if (purchaseConfirmAccepted) {
      purchaseConfirmAccepted = false;
      clearDraft();
      return;
    }
    const rows = Array.from(purchaseLines.querySelectorAll(".purchase-row"));
    if (!rows.length) {
      event.preventDefault();
      alert("Debes anadir al menos un producto antes de registrar la compra.");
      return;
    }

    let hasErrors = false;
    rows.forEach((row) => {
      const qtyInput = row.querySelector('input[name="cantidad[]"]');
      const unitPriceInput = row.querySelector('input[name="precio_compra[]"]');
      const subtotalInput = row.querySelector('input[name="subtotal_compra[]"]');
      const salePriceInput = row.querySelector('input[name="precio_venta_actual[]"]');
      const qtyValue = parseNumber(qtyInput.value);
      const unitPriceValue = parseNumber(unitPriceInput.value);
      const subtotalValue = parseNumber(subtotalInput.value);
      const salePriceValue = parseNumber(salePriceInput.value);
      const fractional = row.dataset.fractional === "1";

      if (qtyValue === null || Number.isNaN(qtyValue) || qtyValue <= 0) {
        hasErrors = true;
        return;
      }
      qtyInput.value = String(qtyValue);

      if (fractional) {
        if (subtotalValue === null || Number.isNaN(subtotalValue) || subtotalValue < 0) {
          hasErrors = true;
          return;
        }
        subtotalInput.value = String(subtotalValue);
        unitPriceInput.value = "";
      } else {
        if (unitPriceValue === null || Number.isNaN(unitPriceValue) || unitPriceValue < 0) {
          hasErrors = true;
          return;
        }
        unitPriceInput.value = String(unitPriceValue);
        syncLinePricing(row);
        const normalizedSubtotal = parseNumber(subtotalInput.value);
        subtotalInput.value = normalizedSubtotal !== null && !Number.isNaN(normalizedSubtotal) ? String(normalizedSubtotal) : "";
      }

      if (salePriceValue === null || Number.isNaN(salePriceValue) || salePriceValue < 0) {
        hasErrors = true;
        return;
      }
      salePriceInput.value = String(salePriceValue);
    });

    if (hasErrors) {
      event.preventDefault();
      alert("Revisa cantidad, precios y subtotales antes de registrar la compra.");
      return;
    }

    event.preventDefault();
    openPurchaseConfirmDialog();
  });

  (function restoreDraft() {
    const raw = sessionStorage.getItem(draftKey);
    if (!raw) return;
    try {
      const draft = JSON.parse(raw);
      if (draft.filters) {
        if (searchBox) searchBox.value = draft.filters.q || (searchBox.value || "");
        if (groupFilter) groupFilter.value = draft.filters.g || (groupFilter.value || "");
      }
      if (draft.fields) {
        purchaseForm.querySelector('[name="fecha_compra"]').value = draft.fields.fecha_compra || purchaseForm.querySelector('[name="fecha_compra"]').value;
        purchaseForm.querySelector('[name="nota_global"]').value = draft.fields.nota_global || "";
      }
      if (Array.isArray(draft.lines)) {
        draft.lines.forEach((line) => {
          if (!line || !line.pid || selectedById.has(line.pid)) return;
          const sourceRow = productRows.find((tr) => tr.dataset.productId === line.pid);
          const baseData = sourceRow ? productDataFromRow(sourceRow) : {
            pid: line.pid,
            name: line.name || line.pid,
            emoji: line.emoji || "📦",
            stockUnit: line.stockUnit || "ud",
            saleUnit: line.saleUnit || line.stockUnit || "ud",
            fractional: Boolean(line.fractional),
            fractions: line.fractions || "1",
            salePrice: line.salePrice || "",
            originalSalePrice: line.originalSalePrice || line.salePrice || "",
          };
          appendPurchaseRow(
            {
              ...baseData,
              qty: line.qty || "",
              price: line.price || "",
              subtotal: line.subtotal || "",
              salePrice: line.salePrice || baseData.salePrice || "",
              originalSalePrice: line.originalSalePrice || baseData.originalSalePrice || "",
              note: line.note || "",
            },
            { focus: false }
          );
        });
      }
    } catch (error) {
      clearDraft();
    }
  })();

  if (!purchaseFiltersForm) {
    applyProductFilters();
  }
  refreshEmptyState();
  refreshSummary();
</script>
