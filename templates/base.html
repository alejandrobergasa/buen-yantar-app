<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>{% if title %}{{ title }} · {% endif %}Buen Yantar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f4b44">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="route-{{ (request.endpoint or 'unknown')|replace('.', '-') }}">
  <a class="skip-link" href="#mainContent">Saltar al contenido principal</a>
  <div class="page-glow page-glow-a" aria-hidden="true"></div>
  <div class="page-glow page-glow-b" aria-hidden="true"></div>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-row">
        <div class="brand-wrap">
          <a
            class="brand brand-home-link"
            href="{{ url_for('home') }}"
            aria-label="Sociedad Buen Yantar - Aplicación Gestora"
          >Sociedad Buen Yantar - Aplicación Gestora</a>
        </div>
      </div>

      {% if session.get("user") %}
      <div class="topbar-actions topbar-actions-simple">
        <nav class="top-actions" aria-label="Acciones de sesión">
          <span class="status-pill status-pill-user">Usuario conectado: {{ session.get("user") }}</span>
          <a class="link link-danger" href="{{ url_for('logout') }}">Cerrar sesion</a>
        </nav>
      </div>
      {% endif %}
    </div>
  </header>

  <main id="mainContent" class="container page-stack">
    {% include "_flash.html" %}
    {% block content %}{% endblock %}
  </main>

  <script>
    document.querySelectorAll("[data-flash-close]").forEach((button) => {
      button.addEventListener("click", () => {
        const item = button.closest(".flash-item");
        if (item) item.remove();
      });
    });

    (() => {
      const toastKey = "buen-yantar:toast";
      const raw = sessionStorage.getItem(toastKey);
      if (!raw) return;
      sessionStorage.removeItem(toastKey);

      let payload;
      try {
        payload = JSON.parse(raw);
      } catch (error) {
        return;
      }

      const host = document.createElement("div");
      host.className = "flash floating-flash";

      const item = document.createElement("div");
      item.className = `flash-item floating-flash-item floating-flash-${payload.tone || "success"}`;

      const textWrap = document.createElement("div");
      const message = document.createElement("strong");
      message.textContent = payload.message || "Operacion completada.";
      textWrap.appendChild(message);

      if (payload.detail) {
        const detail = document.createElement("div");
        detail.className = "floating-flash-detail";
        detail.textContent = payload.detail;
        textWrap.appendChild(detail);
      }

      const close = document.createElement("button");
      close.className = "flash-close";
      close.type = "button";
      close.setAttribute("aria-label", "Cerrar mensaje");
      close.textContent = "×";
      close.addEventListener("click", () => host.remove());

      item.append(textWrap, close);
      host.appendChild(item);
      document.body.appendChild(host);

      window.setTimeout(() => {
        host.remove();
      }, 5000);
    })();
  </script>
</body>
</html>
