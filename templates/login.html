{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
  <section class="panel auth-card">
    <h1 class="page-title">Entrar</h1>

    <form method="post" class="form auth-form">
      <div>
        <label class="label" for="usernameField">Usuario</label>
        <input id="usernameField" class="input" name="username" autocomplete="username" required autofocus>
      </div>

      <div>
        <label class="label" for="passwordField">Contraseña</label>
        <input id="passwordField" class="input" name="password" type="password" autocomplete="current-password" required>
      </div>

      <button class="btn btn-primary" type="submit">Entrar</button>
    </form>
  </section>
</div>
{% endblock %}
