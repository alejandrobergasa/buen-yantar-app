{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
  <section class="panel auth-card">
    <h1 class="page-title">Acceso</h1>
    <p class="lead lead-centered">Introduce tus datos para entrar en la aplicación.</p>

    <form method="post" class="form">
      <div>
        <label class="label" for="usernameField">Usuario</label>
        <input id="usernameField" class="input" name="username" autocomplete="username" required autofocus>
      </div>

      <div>
        <label class="label" for="passwordField">Contraseña</label>
        <input id="passwordField" class="input" name="password" type="password" autocomplete="current-password" required>
      </div>

      <button class="btn btn-primary" type="submit">Entrar</button>
    </form>

    <p class="help auth-help">Si no recuerdas tu acceso, pide ayuda al administrador del sistema.</p>
  </section>
</div>
{% endblock %}
