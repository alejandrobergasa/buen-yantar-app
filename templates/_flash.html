{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="flash" role="status" aria-live="polite" aria-atomic="true">
      {% for m in messages %}
        <div class="flash-item">
          <span>{{ emoji_text(m) }}</span>
          <button class="flash-close" type="button" data-flash-close aria-label="Cerrar mensaje">×</button>
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
